# ============================================================
# 筑梦家 前端生产部署 - Nginx 配置
# 用法（二选一）：
#   1) 站点引入：把本文件放到 /etc/nginx/sites-enabled/ 或
#      在 nginx.conf 的 http{} 中加  include /path/to/nginx.conf;
#   2) 直接指定配置启动：nginx -c /绝对路径/frontend/nginx.conf
# 前提：前端已构建（npm run build 生成 dist/），后端运行在 127.0.0.1:8080
# ============================================================

# 若作为独立配置文件直接启动 nginx -c，需保留以下两行；
# 若被 http{} include 引入，请删除 events/http 外层，只保留 server 块。
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ---- 压缩：减少 JS/CSS/JSON 传输体积 ----
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;
    gzip_vary on;

    server {
        listen 80;
        # 改成你的域名或服务器 IP；若用 IP 直接访问也可保留 _（默认匹配）
        server_name _;

        # 前端构建产物目录（本机 Windows 部署路径；部署到 Linux 服务器时改为此路径）
        root D:/HouseDesign/frontend/dist;
        index index.html;

        # ---- 带 hash 的静态资源：长期缓存（文件名变化即失效） ----
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---- 后端接口：反代到 Spring Boot ----
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 生成任务/上传可能耗时较长，放宽超时
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ---- 用户上传文件 / 生成效果图：反代到 Spring Boot ----
        location /files/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ---- SPA 路由回退（history 模式必须） ----
        # 非文件请求一律交给 index.html，由前端路由接管
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- 常见安全头（可按需调整） ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}
